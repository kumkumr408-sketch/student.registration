<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="registration-card">

            <!-- Header -->
            <div class="header">
                <div class="icon">🎓</div>
                <h1>College Event Registration</h1>
                <p>Register for your favourite college events!</p>
            </div>

            <!-- Progress -->
            <div class="progress">
                <div class="step active" id="step1">
                    <span>1</span>
                    <small>Student Details</small>
                </div>

                <div class="line"></div>

                <div class="step" id="step2">
                    <span>2</span>
                    <small>Select Events</small>
                </div>
            </div>


            <!-- Registration Form -->
            <form id="registrationForm">

                <!-- PAGE 1 -->
                <div class="page active" id="page1">

                    <h2>Student Details</h2>
                    <p class="subtitle">Enter your details to continue.</p>

                    <!-- Name -->
                    <div class="form-group">
                        <label for="name">
                            Name <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                        >

                        <small class="error" id="nameError"></small>
                    </div>


                    <!-- Class -->
                    <div class="form-group">
                        <label for="class">
                            Class <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="class"
                            placeholder="Example: B.Tech 1st Year"
                        >

                        <small class="error" id="classError"></small>
                    </div>


                    <!-- Branch -->
                    <div class="form-group">
                        <label for="branch">
                            Branch <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="branch"
                            placeholder="Example: Computer Science"
                        >

                        <small class="error" id="branchError"></small>
                    </div>


                    <!-- Mobile -->
                    <div class="form-group">
                        <label for="mobile">
                            Mobile Number <span>*</span>
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            maxlength="10"
                            placeholder="Enter 10-digit mobile number"
                        >

                        <small class="error" id="mobileError"></small>
                    </div>


                    <button type="button" class="btn primary" id="nextBtn">
                        Next →
                    </button>

                </div>


                <!-- PAGE 2 -->
                <div class="page" id="page2">

                    <h2>Select Your Events</h2>
                    <p class="subtitle">
                        Choose one or multiple events.
                    </p>


                    <div class="events-grid">

                        <!-- Dance -->
                        <label class="event-card">

                            <input
                                type="checkbox"
                                name="events"
                                value="Dance"
                            >

                            <span class="check">✓</span>

                            <span class="event-icon">💃</span>

                            <span class="event-name">
                                Dance
                            </span>

                            <span class="event-description">
                                Show your moves
                            </span>

                        </label>


                        <!-- Singing -->
                        <label class="event-card">

                            <input
                                type="checkbox"
                                name="events"
                                value="Singing"
                            >

                            <span class="check">✓</span>

                            <span class="event-icon">🎤</span>

                            <span class="event-name">
                                Singing
                            </span>

                            <span class="event-description">
                                Let your voice shine
                            </span>

                        </label>


                        <!-- Standup -->
                        <label class="event-card">

                            <input
                                type="checkbox"
                                name="events"
                                value="Standup Comedy"
                            >

                            <span class="check">✓</span>

                            <span class="event-icon">😂</span>

                            <span class="event-name">
                                Standup Comedy
                            </span>

                            <span class="event-description">
                                Make everyone laugh
                            </span>

                        </label>


                        <!-- Hackathon -->
                        <label class="event-card">

                            <input
                                type="checkbox"
                                name="events"
                                value="Hackathon"
                            >

                            <span class="check">✓</span>

                            <span class="event-icon">💻</span>

                            <span class="event-name">
                                Hackathon
                            </span>

                            <span class="event-description">
                                Build something amazing
                            </span>

                        </label>


                        <!-- Typing -->
                        <label class="event-card">

                            <input
                                type="checkbox"
                                name="events"
                                value="Typing Test"
                            >

                            <span class="check">✓</span>

                            <span class="event-icon">⌨️</span>

                            <span class="event-name">
                                Typing Test
                            </span>

                            <span class="event-description">
                                Test your speed
                            </span>

                        </label>

                    </div>


                    <small class="error" id="eventsError"></small>


                    <div class="button-row">

                        <button
                            type="button"
                            class="btn secondary"
                            id="backBtn"
                        >
                            ← Back
                        </button>

                        <button
                            type="submit"
                            class="btn primary"
                        >
                            Submit ✓
                        </button>

                    </div>

                </div>

            </form>


            <!-- Confirmation -->
            <div class="confirmation" id="confirmation">

                <div class="success-icon">
                    ✓
                </div>

                <h2>
                    Registration Submitted Successfully!
                </h2>

                <p>
                    Thank you,
                    <strong id="confirmName"></strong>.
                </p>


                <div class="summary">

                    <h3>Your Selected Events</h3>

                    <div id="selectedEvents"></div>

                </div>


                <button
                    type="button"
                    class="btn primary"
                    id="registerAgainBtn"
                >
                    Register Another Student
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
